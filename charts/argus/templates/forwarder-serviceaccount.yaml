{{- if .Values.forwarder.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argus.forwarderServiceAccountName" . }}
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: forwarder
# Forwarder has no RBAC bindings and never calls the k8s API — no reason
# to mount an API server token (also set on the pod spec, belt-and-suspenders).
automountServiceAccountToken: false
{{- end }}
