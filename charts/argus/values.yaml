# Default values for argus.
# See values.schema.json for the contract.

# --- Forwarder (this chart's own component) ---
forwarder:
  image:
    repository: python
    tag: "3.13-slim"
    pullPolicy: IfNotPresent

  # Pinned versions for the initContainer's `pip install` — the base image
  # has no dependencies baked in, so these are installed fresh into an
  # emptyDir on every pod (re)start. Unpinned installs would mean a new
  # upstream release (or a PyPI outage) silently changes/breaks the
  # forwarder on the next restart with no version control at all, unlike
  # every other dependency in this repo (Chart.lock, GH Actions digests).
  # Bump deliberately, same as any other dependency bump.
  pythonDeps:
    aiohttp: "3.14.3"
    discordpy: "2.7.1"

  # Pod-level hardening. Forwarder has no cluster RBAC and doesn't need
  # root — runAsUser/runAsGroup/fsGroup are arbitrary non-root IDs so the
  # emptyDir/PVC volumes are group-writable regardless of image UID.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Applied to both the "deps" initContainer and the "forwarder" container.
  # readOnlyRootFilesystem is safe here because every path the process
  # writes to (venv install, /tmp, /data) is an explicit volume mount, not
  # the container's root filesystem.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Holmes /api/chat endpoint. With release=argus the holmes subchart
  # exposes its Service as `argus-holmes` on port 80.
  holmesUrl: http://argus-holmes:80
  holmesModel: auto
  holmesTimeoutSec: 300

  # Which alert severities to investigate. Others are ignored.
  investigateSeverities: "critical,warning"

  dedupeTtlSec: 3600
  logLevel: INFO

  # --- Phase 2: multi-channel routing ---
  # Maps severity → Discord channel webhook URL. The alert-responder
  # GCP secret (monitoring-alert-responder, reused via remoteKey) carries
  # multiple webhook URLs keyed by channel; nixlab's external-secrets
  # template projects them as env.
  #
  # unset = no post to that channel; default is the fallback. Each webhook
  # URL is itself a bearer credential (anyone holding it can post to that
  # channel) — prefer discordChannelSecrets below over setting these
  # directly, which lands the URL in plaintext values/manifests.
  discordChannels:
    default: ""   # DISCORD_WEBHOOK_DEFAULT — required fallback
    critical: ""  # DISCORD_WEBHOOK_CRITICAL
    warning: ""   # DISCORD_WEBHOOK_WARNING
    info: ""      # DISCORD_WEBHOOK_INFO (empty = skip info channel)
    deals: ""     # DISCORD_WEBHOOK_DEALS

  # Secret-sourced override for discordChannels.{critical,warning,info,deals}.
  # When set for a channel, takes precedence over the plaintext value in
  # discordChannels for that same channel — same {name,key} secretKeyRef
  # shape as discordSecret. discordChannels.default already has this via
  # discordSecret (its required fallback); this extends the same pattern
  # to the per-severity overrides.
  discordChannelSecrets:
    critical: {}
      # name: argus-forwarder
      # key: DISCORD_WEBHOOK_CRITICAL
    warning: {}
    info: {}
    deals: {}

  # --- Phase 3: project-agnostic repo mapping ---
  # Maps k8s namespace → GitHub repo (owner/repo). Holmes uses this to
  # know where to open fix PRs. `default` is the fallback for unmapped
  # namespaces.
  repoMappings:
    default: ""
    # nixlab is the cluster owner — most alerts route here.
    monitoring: "olivecasazza/nixlab"
    apps: "olivecasazza/nixlab"
    kube-system: "olivecasazza/nixlab"
    flux-system: "olivecasazza/nixlab"
    games: "olivecasazza/nixlab"
    # Add per-app repos when the fix lives in the app, not the cluster:
    # "apps/stitch-ash": "olivecasazza/stitch-ash"

  # Master switch for ALL Discord output. Set false to run Slack-only.
  # This is a BOOLEAN on purpose: setting discordSecret to {} does NOT disable
  # Discord, because Helm deep-merges values — an empty map merges into the
  # non-empty chart default and the webhook env survives. Only an explicit
  # false (or a null) reliably turns it off.
  discordEnabled: true

  # Discord webhook for the default channel. Secret-sourced. The per-channel
  # webhooks below, when set, override this for that severity.
  # Set to {} to run Slack-only — the forwarder no-ops on an empty webhook,
  # so Discord posting is skipped entirely.
  discordSecret:
    name: argus-forwarder
    key: DISCORD_WEBHOOK

  # --- Phase 4: HITL bot credentials (all optional, degrades gracefully) ---
  # Discord bot token for receiving button interactions. When unset, the
  # forwarder runs in webhook-only mode (phase 2/3/5 behavior) and HITL
  # is REST-only via POST /proposals/{id}/{approve|reject}.
  discordBotToken: {}
    # name: argus-forwarder
    # key: DISCORD_BOT_TOKEN
  # Control channel for status posts (e.g. "argus HITL bot online")
  discordControlChannelId: ""

  # Changelog channel: a running ledger of argus activity (every triage) +
  # proposal lifecycle transitions (proposed/approved/merged/rejected),
  # separate from the severity-routed alert channels. Webhook is a credential,
  # so secretKeyRef only. Unset = changelog posts skipped.
  changelogWebhookSecret: {}
    # name: argus-forwarder
    # key: DISCORD_WEBHOOK_CHANGELOG

  # Slack dual-emit: name of a secret holding SLACK_BOT_TOKEN and
  # SLACK_CHANNEL_{CRITICAL,WARNING,INFO,CHANGELOG}. When set, every alert +
  # changelog post also goes to Slack (chat.postMessage). Empty = Discord only.
  slackSecret: ""  # e.g. "slack-credentials"
  # GitHub PAT for merge-on-approve. When unset, approves mark status
  # 'approved-pending-merge' but don't merge — useful for staging the flow
  # before granting the PAT.
  githubToken: {}
    # name: argus-github
    # key: token

  # --- Phase 4: persistent proposals store ---
  proposalsStorage:
    enabled: true
    size: 100Mi
    storageClassName: ""  # empty = cluster default
  proposalsDbPath: /data/proposals.db

  # Forwarder has NO cluster RBAC — Holmes owns the investigation tools.
  serviceAccount:
    create: true
    name: ""

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Argus-managed custom skills (phase 5: alert-tuning) ---
# Passed to the holmes subchart via customSkills, which auto-mounts them
# at /etc/holmes/skills/ and registers them on CUSTOM_SKILL_PATHS.
argusSkills:
  enabled: true

# --- Holmes subchart override ---
# HolmesGPT itself. We point it at the in-cluster omniroute gateway
# (OpenAI-compatible) and enable the kubernetes toolsets so it can
# actually investigate alerts.
holmes:
  # Disable the subchart's own ServiceAccount — its template hardcodes
  # automountServiceAccountToken: false and ships no ClusterRoleBinding,
  # which force-disables every kubernetes toolset at startup. Argus owns
  # a properly-permissioned SA (see templates/holmes-rbac.yaml) and hands
  # it to holmes via customServiceAccountName.
  createServiceAccount: false
  k8sRBAC: false
  # Use the Argus-managed SA from templates/holmes-rbac.yaml.
  customServiceAccountName: argus-holmes-sa

  rbac:
    # Argus-managed SA + ClusterRoleBinding (view ClusterRole, automount
    # enabled). Skipped if create=false.
    create: true
    serviceAccountName: ""

  toolsets:
    kubernetes/core:
      enabled: true
    kubernetes/logs:
      enabled: true
    prometheus/metrics:
      enabled: true
    internet:
      enabled: true
    connectivity_check:
      enabled: true
    bash:
      enabled: true
      config:
        builtin_allowlist: "extended"

  # Argus custom skills mounted into the Holmes pod via a ConfigMap built
  # from files/skills/*/SKILL.md (see templates/holmes-skills-configmap.yaml).
  # The ConfigMap is mounted read-only and registered on holmes's
  # customSkillPaths so Holmes auto-discovers and matches skills.
  #
  # ConfigMap name is static (argus-holmes-skills) so values.yaml can
  # reference it without template syntax; the ConfigMap template uses
  # the same fixed name.
  customSkillPaths:
    - /etc/argus-skills
  additionalVolumes:
    - name: argus-skills
      configMap:
        name: argus-holmes-skills
  additionalVolumeMounts:
    - name: argus-skills
      mountPath: /etc/argus-skills
      readOnly: true

  # --- Phase 3: GitHub MCP addon (opens PRs against mapped repos) ---
  # Needs a PAT with `repo` scope on the mapped repos, stored in a Secret.
  # For nixlab this is `apps-argus-github` (key `token`) — provisioned
  # via GCP Secret Manager + ESO.
  mcpAddons:
    github:
      enabled: false  # flip via nixlab values once the PAT is provisioned
      auth:
        secretName: argus-github
        secretKey: token
      config:
        toolsets: "repos,issues,pull_requests,actions,context"

  # --- Holmes operator mode ---
  # Watches HealthCheck CRDs and reconciles — lets us schedule proactive
  # checks in addition to reactive webhook-driven triage.
  operator:
    enabled: false  # opt-in; enable once triage quality is trusted

  # Point Holmes at omniroute (OpenAI-compatible gateway).
  # `auto` is omniroute's virtual model ID — LKGP-scored across providers.
  additionalEnvVars:
    - name: OPENAI_API_BASE
      value: http://omniroute.apps.svc.cluster.local:20128/v1
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: cliproxyapi-secrets
          key: API_KEY_PRIMARY

  modelList:
    auto:
      api_key: "{{ env.OPENAI_API_KEY }}"
      api_base: "{{ env.OPENAI_API_BASE }}"
      model: openai/auto
      temperature: 1

  config:
    model: auto

  resources:
    requests:
      cpu: 200m
      memory: 1024Mi
    limits:
      memory: 2Gi
